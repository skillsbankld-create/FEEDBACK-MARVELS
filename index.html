const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const validCode=c=>/^[ABCDEFGHJKLMNPQRSTUVWXYZ2-9]{5}$/.test(c||'');

function parseCode(raw){raw=String(raw||'').trim();if(!raw)return '';const m=raw.match(/[?&]session=([A-Za-z0-9]+)/i);if(m){const c=m[1].toUpperCase();return validCode(c)?c:''}const c=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');return validCode(c)?c:''}

let audio;
function actx(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function tone(f,t,d,type='sine',g=.05,to,dest){const a=actx();if(!a)return;const o=a.createOscillator(),v=a.createGain(),t0=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+.012);v.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(v).connect(dest||a.destination);o.start(t0);o.stop(t0+d+.03)}
function noise(t,d,f0,f1,g=.04,dest){const a=actx();if(!a)return;const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';const t0=a.currentTime+t;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+d);const v=a.createGain();v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+d*.3);v.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f).connect(v).connect(dest||a.destination);s.start(t0)}

function countTo(el,to,ms=700){if(!el)return;const from=Number(el.dataset.v!==undefined?el.dataset.v:el.textContent)||0;el.dataset.v=to;const tok=el._tok=(el._tok||0)+1;if(RM()||from===to){el.textContent=to;return}const t0=performance.now();(function f(now){if(el._tok!==tok)return;const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
const fx=$('fx');let fxc=null,parts=[],fxRun=false;
function confetti(n=90,ox,oy,cols){if(RM())return;fx.width=innerWidth;fx.height=innerHeight;fxc=fx.getContext('2d');ox=ox==null?innerWidth/2:ox;oy=oy==null?innerHeight*.4:oy;cols=cols||['#ffbc39','#ffd98a','#e4b68d','#7fd6ff','#ff7a59','#ffffff'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;parts.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.25+Math.random()*.15,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:90+Math.random()*60})}if(!fxRun){fxRun=true;requestAnimationFrame(stepFx)}}
function stepFx(){const c=fxc;c.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0&&p.y<fx.height+30);for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life--;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.min(1,p.life/30);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}if(parts.length)requestAnimationFrame(stepFx);else{fxRun=false;c.clearRect(0,0,fx.width,fx.height)}}

function showNet(){const n=$('net');const S=mode==='trainer'?TR.sessions.get(TR.active):PS;if(S&&mode==='game'&&me.stage<LIVE_STAGE){n.textContent=S.err?L('○ OFFLINE','○ غير متصل'):L('● JOINED','● منضم');n.style.color=S.err?'#ffbc39':'#8be3b0';return}if(!S){n.textContent=mode==='trainer'?'○':L('◌ SOLO','◌ فردي');n.style.color='#b7b3cf'}else{const ok=isLive(S);n.textContent=ok?L('● LIVE','● مباشر'):L('○ OFFLINE','○ غير متصل');n.style.color=ok?'#8be3b0':'#ffbc39'}
 const rs=$('relayStatus');if(rs){const S2=TR.sessions.get(TR.active);rs.textContent=(!S2||isLive(S2))?'':L('Cannot reach the relay ('+RELAY+'). Check the internet / network blocking, or use the backup import.','تعذر الوصول إلى الوسيط ('+RELAY+'). تحقق من الإنترنت أو حظر الشبكة، أو استخدم الاستيراد الاحتياطي.')+(S2.err?' ['+S2.err+']':'')}}

const outbox=[];let flushing=false;
function publish(S,obj){if(!S)return;outbox.push({S,topic:topicOf(S),payload:{...obj,v:1,session:S.code,at:Date.now()},tries:0});flush()}
async function flush(){if(flushing)return;flushing=true;let warned=false;
 while(outbox.length){const it=outbox[0];
  try{const r=await fetch(RELAY+'/'+it.topic,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(it.payload)});if(!r.ok){const e=Error('HTTP '+r.status);e.status=r.status;throw e}outbox.shift();it.S.sendAt=Date.now();it.S.err='';showNet()}
  catch(e){it.tries++;it.S.err=String(e&&e.message||e).slice(0,40);it.S.sendAt=0;showNet();if(!warned){warned=true;toast(L('Live send failed, retrying. Keep a backup result.','تعذر الإرسال المباشر، سنعيد المحاولة. احتفظ بنسخة احتياطية.'))}if(it.tries>=10){outbox.shift();continue}await sleep(e&&e.status===429?15000:Math.min(1500*it.tries,10000))}}
 flushing=false}
function handleRaw(S,raw){try{const ev=typeof raw==='string'?JSON.parse(raw):raw;if(ev.event&&ev.event!=='message')return;if(ev.id){if(S.lastIds.has(ev.id))return;S.lastIds.add(ev.id);S.lastId=ev.id;if(S.lastIds.size>4000)S.lastIds=new Set([...S.lastIds].slice(-2500))}const x=JSON.parse(ev.message);const info=ingest(S,x);if(info)afterIngest(S,info,x)}catch(e){}}
function sessStop(S){if(!S)return;S.nonce++;try{if(S.es)S.es.close()}catch(e){}S.es=null;clearTimeout(S.rt);clearInterval(S.pt);clearInterval(S.wt);S.sseOK=false}
async function pollOnce(S,n){try{const r=await fetch(RELAY+'/'+topicOf(S)+'/json?poll=1&since='+(S.lastId?encodeURIComponent(S.lastId):'all'));if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();if(n!==S.nonce)return;t.split('\n').forEach(l=>{if(l.trim())handleRaw(S,l)});S.pollAt=Date.now();S.err='';showNet();scheduleRender()}catch(e){S.err=String(e&&e.message||e).slice(0,40);showNet()}}
function startPoll(S,n){clearInterval(S.pt);S.pt=setInterval(()=>{if(n!==S.nonce)return;if(S.sseOK&&Date.now()-S.lastEventAt<80000)return;pollOnce(S,n)},8000)}
function sessConnect(S){if(!S||S.es)return;const n=++S.nonce;
 const url=RELAY+'/'+topicOf(S)+'/sse?since='+(S.lastId?encodeURIComponent(S.lastId):'all');
 let es;try{es=new EventSource(url)}catch(e){S.err='EventSource';startPoll(S,n);pollOnce(S,n);return}
 S.es=es;S.lastEventAt=Date.now();
 es.onopen=()=>{if(n!==S.nonce){es.close();return}S.sseOK=true;S.err='';S.lastEventAt=Date.now();showNet();scheduleRender()};
 es.addEventListener('keepalive',()=>{S.lastEventAt=Date.now()});
 es.onmessage=ev=>{if(n!==S.nonce)return;S.lastEventAt=Date.now();handleRaw(S,ev.data)};
 es.onerror=()=>{if(n!==S.nonce)return;try{es.close()}catch(e){}if(S.es===es)S.es=null;S.sseOK=false;S.err='SSE';showNet();clearTimeout(S.rt);S.rt=setTimeout(()=>{if(n===S.nonce)sessConnect(S)},2500);if(Date.now()-S.pollAt>6000)pollOnce(S,n)};
 startPoll(S,n);
 clearInterval(S.wt);S.wt=setInterval(()=>{if(n!==S.nonce)return;if(S.es&&Date.now()-S.lastEventAt>90000){try{S.es.close()}catch(e){}S.es=null;S.sseOK=false;sessConnect(S)}},15000)}
const sorted=S=>[...S.players.values()].sort((a,b)=>(b.done-a.done)||a.name.localeCompare(b.name));
const sid=id=>String(id).slice(0,10);
const teamOf=(S,id)=>{if(!S)return 0;const k=sid(id);for(const n of [1,2,3])if(S.teams[n].includes(k))return n;return 0};
const popc=n=>{let c=0;while(n){c+=n&1;n>>=1}return c};
/* ===== MESSAGE PROTOCOL (all < 4096 bytes) =====
   join {id,name}                    -> player appears
   prog {id,name,q,ans}              -> test progress; ans = 15 chars of a|b|c|d|- (q = answered count)
   done {id,name,ans}                -> test finished (sticky)
   team {n:1|2|3,rev,ids:[sid...],bal}-> trainer's team split. 3 messages share one rev; the highest rev wins; ids are the first 10 chars of the player id
   end {}                            -> trainer closed/reset the session                                                    */
const cleanAns=a=>String(a||'').toLowerCase().replace(/[^abcd-]/g,'-').slice(0,NQ).padEnd(NQ,'-');
function ingest(S,x){
 if(!x||x.v!==1||x.session!==S.code)return null;
 if(x.type==='end'){S.ended=true;return{type:'end'}}
 if(x.type==='team'){const rev=Number(x.rev)||0,n=Number(x.n);if(![1,2,3].includes(n)||!Array.isArray(x.ids))return null;if(rev<S.teamRev)return null;
  if(rev>S.teamRev){S.teamRev=rev;S.teams={1:[],2:[],3:[]};S.teamGot=new Set();S.teamAt=Number(x.at)||0;S.bal=0}
  S.teamGot.add(n);
  S.teams[n]=x.ids.filter(i=>typeof i==='string').slice(0,300).map(i=>i.slice(0,12));if(x.bal!=null)S.bal=Math.max(0,Math.min(100,Math.round(Number(x.bal)||0)));
  return{type:'team',rev,n}}
 if(!['join','prog','done'].includes(x.type))return null;
 if(typeof x.id!=='string'||typeof x.name!=='string'||!x.id||!x.name)return null;
 const at=Number(x.at)||0,isNew=!S.players.has(x.id);
 const old=S.players.get(x.id)||{id:x.id,name:'',q:0,ans:'-'.repeat(NQ),done:false,ts:{}};
 const p={...old,ts:{...old.ts},name:x.name.slice(0,48)};
 if(x.type==='prog'&&at>=(p.ts.prog||0)&&!p.done){p.ts.prog=at;p.ans=cleanAns(x.ans);p.q=Math.max(0,Math.min(NQ,Math.round(Number(x.q)||0)))}
 if(x.type==='done'&&at>=(p.ts.done||0)){p.ts.done=at;p.ans=cleanAns(x.ans);p.q=NQ;p.done=true}
 S.players.set(x.id,p);return{type:x.type,p,isNew,wasDone:old.done}}
let rt=null;function scheduleRender(){if(rt)return;rt=setTimeout(()=>{rt=null;try{if(mode==='trainer')renderTrainer();if(!$('proj').classList.contains('hide'))renderProj();updateHUD();updateTeamBox()}catch(e){}},120)}
let lastPing=0;
function afterIngest(S,info,x){
 const live=Date.now()-(Number(x.at)||0)<20000;
 if(TR.unlocked&&TR.sessions.get(S.code)===S){
  if(live&&info.type==='join'&&info.isNew){toast('👤 '+info.p.name+' · '+S.code);snd('ping')}
  if(live&&info.type==='done'&&!info.wasDone){toast('✅ '+info.p.name);snd('sparkle')}
  if(live&&(info.type==='prog'||info.type==='done')){S.flash.add(info.p.id);if(Date.now()-lastPing>1500){lastPing=Date.now();snd('tick')}}
 }
 if(S===PS){if(info.type==='end')renderEndedNote();if(info.type==='team')onTeamsChanged(live)}
 scheduleRender()}

/* ===== MUSIC: generative cinematic "Marvels" theme (D minor, 92 BPM), pure Web Audio, no files =====
   level 0 = calm pad + sparkle arpeggio · 1 = + pulse, bass, hats · 2 = + brass melody, snare, timpani (team reveal / projector) */
const MUS={on:true,go:false,gain:null,comp:null,step:0,next:0,timer:null,level:0,want:0,bpm:92};
const mf=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[{r:38,p:[57,62,65]},{r:46,p:[58,62,65]},{r:41,p:[57,60,65]},{r:48,p:[55,60,64]},{r:38,p:[57,62,65]},{r:46,p:[58,62,65]},{r:43,p:[58,62,67]},{r:45,p:[57,61,64]}];
const MEL=[[[74,0,8],[77,8,4],[81,12,4]],[[82,0,6],[81,6,2],[77,8,8]],[[77,0,4],[81,4,4],[84,8,8]],[[84,0,6],[79,6,2],[76,8,8]],[[74,0,8],[77,8,4],[81,12,4]],[[86,0,8],[82,8,4],[81,12,4]],[[79,0,4],[82,4,4],[86,8,8]],[[85,0,6],[81,6,2],[81,8,8]]];
function musBus(){const a=actx();if(!a)return null;if(!MUS.gain){MUS.comp=a.createDynamicsCompressor();MUS.comp.threshold.value=-18;MUS.comp.ratio.value=4;MUS.gain=a.createGain();MUS.gain.gain.value=MUS.on?.5:0;MUS.gain.connect(MUS.comp).connect(a.destination)}return MUS.gain}
function mpad(notes,t,dur){const a=actx(),bus=MUS.gain;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+dur*.6);lp.frequency.linearRampToValueAtTime(600,t+dur);
 const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.7);g.gain.setValueAtTime(.05,t+dur-.5);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.4);lp.connect(g).connect(bus);
 notes.forEach(m=>[-7,6].forEach(c=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=c;const og=a.createGain();og.gain.value=.4;o.connect(og).connect(lp);o.start(t);o.stop(t+dur+.5)}))}
function mlead(m,t,dur,g){const a=actx(),bus=MUS.gain;const o=a.createOscillator(),o2=a.createOscillator(),lp=a.createBiquadFilter(),v=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
 o.type='sawtooth';o2.type='square';o.frequency.value=mf(m);o2.frequency.value=mf(m);o2.detune.value=4;lfo.frequency.value=5.4;lg.gain.value=7;lfo.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
 lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(3200,t+.12);lp.frequency.exponentialRampToValueAtTime(1600,t+dur);lp.Q.value=2;
 v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.05);v.gain.setValueAtTime(g*.8,t+Math.max(.06,dur-.12));v.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(lp);o2.connect(lp);lp.connect(v).connect(bus);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.05)})}
function mstep(i,t){const a=actx(),bar=Math.floor(i/16)%8,s=i%16,ch=CHORDS[bar],sd=60/MUS.bpm/4,L=MUS.level,rel=t-a.currentTime;
 if(s===0)mpad(ch.p.concat(ch.p[0]+12),t,sd*16);
 if(L>=0&&s%2===0){const arp=[ch.p[0]+12,ch.p[1]+12,ch.p[2]+12,ch.p[1]+24][(s/2)%4];tone(mf(arp),rel,.5,'triangle',L>=1?.016:.013,undefined,MUS.gain)}
 if(L>=1){
  if(s===0||s===8||(L>=2&&s===10)){tone(mf(ch.r),rel,sd*3.2,'triangle',.085,undefined,MUS.gain);tone(mf(ch.r-12),rel,sd*3.2,'sine',.09,undefined,MUS.gain)}
  if(s===0||s===8){tone(130,rel,.3,'sine',.2,42,MUS.gain)}
  if(s%2===0)noise(rel,.035,7000,9500,s%4===0?.022:.012,MUS.gain)}
 if(L>=2){
  if(s===4||s===12){noise(rel,.16,1800,900,.05,MUS.gain);tone(190,rel,.12,'triangle',.05,120,MUS.gain)}
  if(bar%2===1&&s>=8)tone(88+(s-8)*2,rel,.12,'sine',.1+(s-8)*.012,55,MUS.gain);
  if(bar===7&&s===15)noise(rel,1.2,6000,400,.07,MUS.gain);
  MEL[bar].forEach(([m,st,len])=>{if(st===s)mlead(m,t,sd*len*.95,.05)});
  if(s===0&&bar===0)tone(mf(50),rel,sd*16,'sawtooth',.012,undefined,MUS.gain)}}
function mtick(){const a=actx();if(!a||!MUS.go)return;const sd=60/MUS.bpm/4;
 if(MUS.next<a.currentTime-.2)MUS.next=a.currentTime+.05;
 while(MUS.next<a.currentTime+.3){if(MUS.level!==MUS.want&&MUS.step%16===0)MUS.level=MUS.want;if(MUS.on)mstep(MUS.step,MUS.next);MUS.step=(MUS.step+1)%128;MUS.next+=sd}}
function musStart(){if(MUS.go||!MUS.on)return;if(!musBus())return;MUS.go=true;MUS.next=actx().currentTime+.1;clearInterval(MUS.timer);MUS.timer=setInterval(()=>{try{mtick()}catch(e){}},90);mtick()}
function musLevel(n){MUS.want=n;if(!MUS.go)MUS.level=n}
function musSet(on){MUS.on=on;store.set('fm_music',on?'on':'off');const b=$('musicBtn');if(b){b.classList.toggle('off',!on);b.setAttribute('aria-pressed',on?'true':'false')}
 if(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(.5,actx().currentTime,.2);musStart()}else if(MUS.gain)MUS.gain.gain.setTargetAtTime(0,actx().currentTime,.15)}
function musDuck(ms){if(!MUS.gain||!MUS.on)return;const a=actx(),t=a.currentTime;MUS.gain.gain.cancelScheduledValues(t);MUS.gain.gain.setTargetAtTime(.18,t,.05);MUS.gain.gain.setTargetAtTime(.5,t+ms/1000,.4)}

/* ===== PROFILE + BALANCED TEAM SPLIT =====
   profile(ans): G/R/L = strength sums per section (0–15), st = counts per style, dom = dominant style.
   makeTeams(): snake-draft start + simulated-annealing swaps so that each team's SUM of every feature matches its size share:
   same number of people (±1), same strength in giving / receiving / leading, same mix of the four styles. */
function profile(ans){ans=cleanAns(ans);const G0=[0,0,0],st={D:0,S:0,A:0,O:0},sst={D:0,S:0,A:0,O:0};let n=0;
 for(let i=0;i<NQ;i++){const c=ans[i];if(c==='-')continue;const o=QUESTIONS[i].o['abcd'.indexOf(c)];if(!o)continue;n++;const sec=Math.floor(i/5);G0[sec]+=o[2];st[o[1]]++;sst[o[1]]+=o[2]}
 let dom='D',bs=-1;for(const k of STYLES){const sc=st[k]*100+sst[k];if(sc>bs){bs=sc;dom=k}}
 return{G:G0[0],R:G0[1],L:G0[2],st,dom,n}}
const FW=[1,1,1,.6,.6,.6,.6];
function feats(p){const q=profile(p.ans);return[q.G/15,q.R/15,q.L/15,q.st.D/5,q.st.S/5,q.st.A/5,q.st.O/5]}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function teamCost(sums,sizes,mean){let c=0;for(let t=0;t<3;t++)for(let k=0;k<7;k++){const d=sums[t][k]-sizes[t]*mean[k];c+=FW[k]*d*d}return c}
function makeTeams(list,seed){
 const n=list.length;if(n<3)return null;const rnd=mulberry(seed||1),F=list.map(feats),mean=Array(7).fill(0);F.forEach(f=>f.forEach((v,k)=>mean[k]+=v/n));
 let best=null,bestC=Infinity;
 for(let r=0;r<30;r++){
  const sizes=[Math.floor(n/3),Math.floor(n/3),Math.floor(n/3)];const ord=[0,1,2].sort(()=>rnd()-.5);for(let i=0;i<n%3;i++)sizes[ord[i]]++;
  const idx=[...Array(n).keys()].map(i=>[i,F[i][0]+F[i][1]+F[i][2]+rnd()*.5]).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);
  const tm=Array(n).fill(0),cnt=[0,0,0];let dir=1,t=rnd()*3|0;
  for(const i of idx){let guard=0;while(cnt[t]>=sizes[t]&&guard++<9){t+=dir;if(t>2){t=2;dir=-1}else if(t<0){t=0;dir=1}}tm[i]=t;cnt[t]++;t+=dir;if(t>2){t=2;dir=-1}else if(t<0){t=0;dir=1}}
  const sums=[0,1,2].map(()=>Array(7).fill(0));idx.forEach(i=>F[i].forEach((v,k)=>sums[tm[i]][k]+=v));
  let c=teamCost(sums,sizes,mean);const iters=2600+n*30;
  for(let it=0;it<iters;it++){const a=rnd()*n|0,b=rnd()*n|0;if(tm[a]===tm[b])continue;const ta=tm[a],tb=tm[b];
   for(let k=0;k<7;k++){const d=F[b][k]-F[a][k];sums[ta][k]+=d;sums[tb][k]-=d}
   const nc=teamCost(sums,sizes,mean),T=.03*(1-it/iters)+1e-5;
   if(nc<=c||rnd()<Math.exp((c-nc)/T)){tm[a]=tb;tm[b]=ta;c=nc}else{for(let k=0;k<7;k++){const d=F[b][k]-F[a][k];sums[ta][k]-=d;sums[tb][k]+=d}}}
  if(c<bestC){bestC=c;best=tm.slice()}}
 const teams=[[],[],[]];best.forEach((t,i)=>teams[t].push(list[i].id));
 return{teams,bal:balanceIndex(list,teams)}}
function balanceIndex(list,teams){const by=new Map(list.map(p=>[p.id,p]));const nz=teams.filter(t=>t.length);if(nz.length<3)return 0;
 const F=list.map(feats),mn=Array(7).fill(1e9),mx=Array(7).fill(-1e9);F.forEach(f=>f.forEach((v,k)=>{mn[k]=Math.min(mn[k],v);mx[k]=Math.max(mx[k],v)}));
 const avg=teams.map(t=>{const a=Array(7).fill(0);t.forEach(id=>{const f=feats(by.get(id));f.forEach((v,k)=>a[k]+=v/t.length)});return a});
 let s=0;for(let k=0;k<7;k++){const sp=Math.max(...avg.map(a=>a[k]))-Math.min(...avg.map(a=>a[k]));s+=sp/Math.max(.2,mx[k]-mn[k])}
 const sizeGap=Math.max(...teams.map(t=>t.length))-Math.min(...teams.map(t=>t.length));
 return Math.max(0,Math.min(100,Math.round(100-100*s/7-(sizeGap>1?10*(sizeGap-1):0))))}
function teamStats(list,ids){const by=new Map(list.map(p=>[p.id,p]));const o={n:ids.length,G:0,R:0,L:0,st:{D:0,S:0,A:0,O:0}};ids.forEach(id=>{const p=by.get(id);if(!p)return;const q=profile(p.ans);o.G+=q.G;o.R+=q.R;o.L+=q.L;o.st[q.dom]++});
 if(o.n){o.G/=o.n;o.R/=o.n;o.L/=o.n}return o}

  (S.teamRev&&(ids.length||shuf)?'<div class="cnt">'+(shuf?items.length:ids.length)+' '+L('heroes','أبطال')+'</div><div class="pnames">'+items.map((nm,i)=>'<div class="pn'+(shuf?' shuf':'')+'" style="animation-delay:'+(shuf?0:i*140)+'ms">'+esc(nm)+'</div>').join('')+'</div>':'<div class="pgate">'+TEAMNAME[n]+'</div><div class="cnt">'+L('Awaiting heroes…','بانتظار الأبطال…')+'</div>')+'</div>'}
function renderProj(){
 const S=cur();if(!S||S.animPlaying)return;$('projCode').textContent=S.code;$('projUrl').textContent=baseURL().replace(/^https?:\/\//,'').replace(/^file:\/\/\/?/,'');
 const list=sorted(S),a=assigned(S),tot=a.size,rest=list.filter(p=>!a.has(sid(p.id)));
 if(S.animReq&&S.animReq===S.teamRev&&S.animShown!==S.teamRev&&tot){projReveal(S);return}
 let h='<div class="pboard">'+[1,2,3].map(n=>teamHTML(S,n)).join('')+'</div>';
 if(tot&&S.bal>=60)h+='<div class="balrib">⚖ '+L('BALANCE INDEX','مؤشر التوازن')+' · '+S.bal+'%</div>';
 h+='<div class="small muted" style="margin-top:14px;font-size:16px">'+(tot?L('Waiting to be placed','بانتظار التوزيع'):L('Heroes gathering','تجمّع الأبطال'))+' · '+rest.filter(p=>p.done).length+' ✔ / '+rest.length+'</div><div class="lobby">'+rest.map(p=>{const isNew=!S.seenProj.has(p.id);S.seenProj.add(p.id);return '<div class="lp'+(p.done?' done':'')+'" style="'+(isNew?'':'animation:none')+'">'+(p.done?'✦ ':'')+esc(p.name)+(p.done?'':'<i style="width:'+progOf(p)+'%"></i>')+'</div>'}).join('')+'</div>';
 $('projBody').innerHTML=h}
async function projReveal(S){
 if(S.animPlaying||S.animShown===S.teamRev)return;S.animPlaying=true;const rev=S.teamRev;S.animReq=0;
 const names=doneList(S).map(p=>p.name);const sz=[1,2,3].map(n=>S.teams[n].length);
 musDuck(4200);snd('roll');
 $('projBody').innerHTML='<div class="sp-sub" style="font-size:clamp(16px,3vw,30px);margin:16px 0">'+esc(L('ASSEMBLING THE MARVELS…','تجميع الأبطال…'))+'</div><div class="pboard" id="shufBoard"></div>';
 const t0=Date.now(),dur=RM()?10:2600;
 while(Date.now()-t0<dur){const pool=names.slice().sort(()=>Math.random()-.5);let k=0;const el=$('shufBoard');if(!el)break;
  el.innerHTML=[1,2,3].map((n,i)=>teamHTML(S,n,true,Array.from({length:Math.min(sz[i],12)},()=>pool[(k++)%pool.length]||'…'))).join('');snd('tick');await sleep(130)}
 S.animPlaying=false;S.animShown=rev;snd('teams');flash('gold');confetti(260,innerWidth/2,innerHeight*.3);
 renderProj();musLevel(2);setTimeout(()=>{if(!$('proj').classList.contains('hide'))musLevel(1);else musLevel(0)},28000);
 const nm=Math.min(S.teams[1].length+S.teams[2].length+S.teams[3].length,30);for(let i=0;i<nm;i++)setTimeout(()=>snd('ping'),i*(140/1.5)*1.5+300)}
/* ---------- files ---------- */
function csv(){const S=cur();if(!S)return;const head=['Session','Name','Finished','Answers','Style','Giving','Receiving','Leading','Team'];
 const rows=sorted(S).map(p=>{const pr=profile(p.ans);return[S.code,p.name,p.done,cleanAns(p.ans),pr.n?ARCH[pr.dom].n[0]:'',pr.G,pr.R,pr.L,teamOf(S,p.id)||'']});
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';download('feedback-marvels-'+S.code+'.csv','\ufeff'+[head,...rows].map(a=>a.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
/* ---------- language ---------- */
function setLang(v){lang=v==='ar'?'ar':'en';document.documentElement.lang=lang;document.body.dir=lang==='ar'?'rtl':'ltr';$('langBtn').textContent=lang==='ar'?'English':'العربية';
 document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=tt(e.dataset.i)});
 $('playerName').placeholder=L('Full name','الاسم الكامل');$('labelInput').placeholder=L('e.g. Group A','مثال: المجموعة أ');
 store.set('fm_lang',lang);showNet();drawFrame();
 if(mode==='game')renderStage();if(mode==='trainer')renderTrainer();if(!$('proj').classList.contains('hide'))renderProj();checkResume()}
/* ---------- wiring ---------- */
$('langBtn').onclick=()=>{snd();setLang(lang==='en'?'ar':'en')};
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';store.set('fm_sound',soundOn?'on':'off');if(soundOn)snd()};
$('musicBtn').onclick=()=>{actx();musSet(!MUS.on)};
$('splash').onclick=()=>{skipSplash=true};
$('joinBtn').onclick=startPlay;
$('playerName').onkeydown=e=>{if(e.key==='Enter')startPlay()};$('joinCode').onkeydown=e=>{if(e.key==='Enter')startPlay()};
$('joinCode').oninput=e=>{const v=e.target.value,c=v.length>5?parseCode(v):'';e.target.value=c||v.toUpperCase()};
$('resumeBtn').onclick=()=>{const s=loadSaved();if(!s)return;actx();musStart();me={...emptyMe(),...s};bindPS();snd('join');view('game');if(me.stage>=LIVE_STAGE)ensureLive();renderStage()};
$('discardBtn').onclick=()=>{store.del('fm_me');checkResume()};

const unlock=()=>{if($('pinInput').value===PIN){TR.unlocked=true;snd('win');openTrainer()}else{snd('err');flash('red');toast(L('Wrong access code','كود خاطئ'))}};
$('pinBtn').onclick=unlock;$('pinInput').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('copyLink').onclick=()=>{const S=cur();if(S)copyText(joinURL(S.code))};$('copyArabic').onclick=()=>{const S=cur();if(S)copyText(joinURL(S.code,'ar'))};
$('projBtn').onclick=openProj;$('projClose').onclick=closeProj;
arm($('resetBtn'),()=>resetSession(TR.active));arm($('closeBtn'),()=>closeSession(TR.active));
$('labelInput').oninput=e=>{const S=cur();if(S){S.label=e.target.value.slice(0,30);persist();renderTabs()}};
$('formBtn').onclick=formTeams;$('shuffleBtn').onclick=reshuffle;$('lateBtn').onclick=addLate;arm($('clearTeamsBtn'),clearTeams);$('csvBtn').onclick=csv;
$('refreshBtn').onclick=()=>{const S=cur();if(!S)return;sessStop(S);S.players=new Map();S.lastIds.clear();S.lastId=null;S.teams={1:[],2:[],3:[]};S.teamRev=0;S.teamGot=new Set();S.ended=false;sessConnect(S);toast(L('Reconnecting and rebuilding session','إعادة الاتصال وإعادة بناء الجلسة'))};
$('importFile').onchange=async e=>{const S=cur();if(!S)return;let ok=0,skip=0;
 for(const f of e.target.files){try{const x=JSON.parse(await f.text());if(x.type!=='backup'||x.session!==S.code||!x.id||typeof x.name!=='string'){skip++;continue}
  S.players.set(String(x.id),{id:String(x.id),name:x.name.slice(0,48),q:NQ,ans:cleanAns(x.ans),done:true,ts:{prog:Date.now(),done:Date.now()}});ok++}catch(err){skip++}}
 e.target.value='';renderTrainer();toast(L('Imported '+ok+(skip?' · skipped '+skip:''),'تم استيراد '+ok+(skip?' · تم تخطي '+skip:'')))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('proj').classList.contains('hide'))closeProj()});
const firstGesture=()=>{actx();if(MUS.on)musStart()};document.addEventListener('pointerdown',firstGesture,{once:true});document.addEventListener('keydown',firstGesture,{once:true});
/* ---------- decor: art-deco frame, skyline, gold dust ---------- */
function drawFrame(){const f=$('frame');if(!f)return;const w=innerWidth,h=innerHeight,sm=w<600,m=sm?7:14,g=sm?30:56,i0=m+(sm?5:9),ln=sm?44:84,lv=sm?60:110;
 const l=(a,b,c,d)=>'<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'"/>';
 let p=l(m,m,w/2-g,m)+l(w/2+g,m,w-m,m)+l(m,h-m,w/2-g,h-m)+l(w/2+g,h-m,w-m,h-m)+l(m,m,m,h/2-g)+l(m,h/2+g,m,h-m)+l(w-m,m,w-m,h/2-g)+l(w-m,h/2+g,w-m,h-m);
 p+=l(i0,i0,i0+ln,i0)+l(i0,i0,i0,i0+lv)+l(w-i0,i0,w-i0-ln,i0)+l(w-i0,i0,w-i0,i0+lv)+l(i0,h-i0,i0+ln,h-i0)+l(i0,h-i0,i0,h-i0-lv)+l(w-i0,h-i0,w-i0-ln,h-i0)+l(w-i0,h-i0,w-i0,h-i0-lv);
 const st=(x,y,r)=>'M'+x+','+(y-r)+'Q'+(x+r*.1)+','+(y-r*.1)+' '+(x+r)+','+y+'Q'+(x+r*.1)+','+(y+r*.1)+' '+x+','+(y+r)+'Q'+(x-r*.1)+','+(y+r*.1)+' '+(x-r)+','+y+'Q'+(x-r*.1)+','+(y-r*.1)+' '+x+','+(y-r)+'Z';
 const R=sm?11:17,r2=sm?3:4.5;let s=st(w/2,m,R)+st(w/2,h-m,R)+st(m,h/2,R)+st(w-m,h/2,R)+[-1,1].map(d=>st(w/2+d*g*.62,m,r2)+st(w/2+d*g*.62,h-m,r2)+st(m,h/2+d*g*.62,r2)+st(w-m,h/2+d*g*.62,r2)).join('');
 f.setAttribute('viewBox','0 0 '+w+' '+h);f.innerHTML='<g stroke="#e4b68d" stroke-width="1" opacity=".75" fill="none">'+p+'</g><g fill="#ffd98a" class="twk"><path d="'+s+'"/></g>'}
addEventListener('resize',()=>{try{drawFrame()}catch(e){}});
(()=>{const el=$('skyline');if(!el)return;let seed=7;const rn=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};let x=0,b='',win='';
 el.setAttribute('viewBox','0 0 1200 300');el.innerHTML='<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbc39" stop-opacity=".16"/><stop offset="1" stop-color="#ffbc39" stop-opacity="0"/></linearGradient></defs>';
 while(x<1200){const w=26+rn()*46,mid=1-Math.abs(x-600)/700,hh=50+rn()*150*(.4+mid);const y=300-hh;b+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'"/>';
  if(hh>110){b+='<rect x="'+(x+w*.18)+'" y="'+(y-22)+'" width="'+(w*.64)+'" height="22"/><rect x="'+(x+w*.38)+'" y="'+(y-44)+'" width="'+(w*.24)+'" height="22"/><line x1="'+(x+w/2)+'" y1="'+(y-44)+'" x2="'+(x+w/2)+'" y2="'+(y-70)+'"/>'}
  for(let k=0;k<hh/26;k++)if(rn()>.55)win+='<rect class="twk" style="animation-delay:'+(rn()*3).toFixed(2)+'s" x="'+(x+5+rn()*(w-12))+'" y="'+(y+8+k*24)+'" width="3" height="5"/>';x+=w+2+rn()*8}
 el.innerHTML+='<g fill="url(#sg)" stroke="#e4b68d" stroke-opacity=".28" stroke-width=".8">'+b+'</g><g fill="#ffd98a" opacity=".6">'+win+'</g>'})();
(()=>{const c=$('bg');if(!c||RM())return;const x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
 for(let i=0;i<54;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.4,vx:(Math.random()-.5)*.2,vy:-Math.random()*.32-.06,c:['#ffbc39','#ffd98a','#e4b68d'][i%3],ph:Math.random()*6});
 (function f(t){x.clearRect(0,0,w,h);for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.globalAlpha=.25+.45*Math.abs(Math.sin(t/1400+p.ph));x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(f)})(0)})();
/* ---------- boot ---------- */
(()=>{const q=new URLSearchParams(location.search);soundOn=store.get('fm_sound')!=='off';$('soundBtn').textContent=soundOn?'🔊':'🔇';MUS.on=store.get('fm_music')!=='off';$('musicBtn').classList.toggle('off',!MUS.on);
 setLang(q.get('lang')||store.get('fm_lang')||'en');
 const sp=(q.get('session')||'').toUpperCase();
 if(sp){if(validCode(sp)){$('joinCode').value=sp;$('joinStatus').textContent=L('Session '+sp+' detected. Enter your name and join.','تم التعرف على السيشن '+sp+'. اكتب اسمك وانضم.')}else $('joinStatus').textContent=L('This link has an old or invalid code. Ask your trainer for the new link.','هذا الرابط يحتوي على كود قديم أو غير صحيح. اطلب الرابط الجديد من المدرب.')}
 showNet();checkResume()})();
